name: pick_place
# Skill package: coordinate-based pick-and-place (no vision).
# Grasps at an absolute position and releases at position + offset. Consumes
# the d1_arm / d1_hand primitives over gRPC (see robonix_manifest.yaml); no
# camera, no YOLO, no hand-eye calibration. No hardware config here — that
# lives on the primitives; this package only needs to reach atlas.

build:
  command: bash scripts/build.sh
  # No hardware; the skill discovers primitives via atlas at runtime.

run:
  command: bash scripts/start.sh

depends_on:
  robonix/primitive/arm/get_state:
    optional: false
  robonix/primitive/arm/move_joint:
    optional: false
  robonix/primitive/hand/move_joint:
    optional: false
  robonix/primitive/hand/get_state:
    optional: false
  robonix/primitive/hand/info:
    optional: false
