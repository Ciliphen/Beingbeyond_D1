manifestVersion: 1
name: block_grasp_deploy

env:
  LOG: "INFO"

system:
  atlas:
    listen: 127.0.0.1:50051
  executor:
    listen: 127.0.0.1:50061
  pilot:
    listen: 127.0.0.1:50071
    vlm:
      upstream: https://api.deepseek.com
      api_key: ${VLM_API_KEY}
      model: deepseek-v4-flash
      api_format: openai
  liaison:
    listen: 127.0.0.1:50081
    log: info

# soma_d1 — D1 body model (fixed-base arm, no chassis). Boots before the
# skill so any consumer can query the body model. Provided as a service
# package (kind=service) rather than a built-in system component.
service:
  - name: soma
    path: ../soma_d1

skill:
  - name: block_grasp
    path: ../block_grasp_skill
