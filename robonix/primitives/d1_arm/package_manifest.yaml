# D1 arm — primitive package (6-DOF arm over the HeadArm serial link, direct/non-ROS).
manifestVersion: 1

package:
  name: com.beingbeyond.primitive.d1_arm
  version: 0.1.0
  vendor: beingbeyond
  description: D1 6-DOF arm primitive — absolute joint control (rad) + Cartesian move_pose via the SDK's arm-only IK.
  license: MulanPSL-2.0

build: bash scripts/build.sh
start: bash scripts/start.sh

# Joint-level (rad) and Cartesian (IK) rpc contracts served over gRPC. Only the
# 6 arm joints are exposed; the 2 head joints share the same serial link and are
# held at their current pose. get_state is an rpc read (the D1 deploy has no ROS
# backend, so no state_joint topic_out). `driver` is the lifecycle interface
# (wired to on_init).
capabilities:
  - name: robonix/primitive/arm/driver
  - name: robonix/primitive/arm/info
  - name: robonix/primitive/arm/move_joint
  - name: robonix/primitive/arm/get_state
  - name: robonix/primitive/arm/move_pose
  - name: robonix/primitive/arm/set_head

depends: []
